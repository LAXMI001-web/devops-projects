apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
      - name: user-service
        image: microservice:1.0
        imagePullPolicy: Never
        ports: [{ containerPort: 3000 }]
        env:
        - { name: SERVICE_NAME, value: user-service }
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: shop }
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: product-service, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: product-service } }
  template:
    metadata: { labels: { app: product-service } }
    spec:
      containers:
      - name: product-service
        image: microservice:1.0
