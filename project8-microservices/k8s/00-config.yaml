apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: shop }
data:
  MONGO_HOST: mongodb
---
apiVersion: v1
kind: Secret
metadata: { name: app-secret, namespace: shop }
type: Opaque
stringData:
  MONGO_USER: admin
  MONGO_PASSWORD: password
